<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>അധ്യാപക ദിന പോസ്റ്റർ - MIUPS കുറ്റ്യാടി</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<style>
:root {
  --blue:#163f5b;
  --gold:#9b681f;
  --bg:#eef3f8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Noto Sans Malayalam",sans-serif;color:#18384e}
.app{max-width:560px;margin:auto;background:#fff;min-height:100vh;padding:16px}
h1{font-size:23px;text-align:center;margin:4px 0 16px;color:var(--blue)}
.card{border:1px solid #dce6ee;border-radius:14px;padding:14px;margin-bottom:14px;background:#fff;box-shadow:0 3px 14px rgba(20,57,82,.06)}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 5px}
input,button{width:100%;font-family:inherit}
input[type=file],input[type=text]{padding:11px;border:1px solid #cfd9e0;border-radius:10px;font-size:15px}
input[type=range]{accent-color:var(--blue)}
button{padding:13px 12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
button.secondary{background:#6b7f8d}
button.gold{background:var(--gold)}
#cropWrap{display:none;margin-top:12px;max-height:420px;overflow:hidden;background:#f4f6f8;border-radius:12px}
#image{display:block;max-width:100%}
.hint{font-size:12px;color:#647581;margin:8px 0 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview-box{position:relative;border-radius:14px;overflow:hidden;background:#ddd;box-shadow:0 4px 18px #0002}
#preview{width:100%;display:block}
#downloadBtn{text-decoration:none;display:none}
.small{font-size:12px;text-align:center;color:#71808a;margin-top:10px}
.hidden{display:none!important}
@media(max-width:420px){.app{padding:10px}}
</style>
</head>
<body>
<div class="app">
  <h1>അധ്യാപക ദിന പോസ്റ്റർ</h1>

  <div class="card">
    <label for="upload">ഫോട്ടോ തിരഞ്ഞെടുക്കുക</label>
    <input type="file" id="upload" accept="image/*">
    <div id="cropWrap"><img id="image" alt="Crop image"></div>
    <p class="hint">ഫോട്ടോ തിരഞ്ഞെടുക്കി crop ചെയ്യാം. മുഖം വ്യക്തമായി കാണുന്ന രീതിയിൽ crop ചെയ്യുക.</p>

    <label for="nameInput">പേര്</label>
    <input type="text" id="nameInput" placeholder="ഉദാ: മുഹമ്മദ് റാഷിദ്">

    <label for="schoolInput">സ്കൂൾ / സ്ഥലം</label>
    <input type="text" id="schoolInput" placeholder="ഉദാ: എംഐയുപി സ്കൂൾ, കുറ്റ്യാടി" value="എംഐയുപി സ്കൂൾ, കുറ്റ്യാടി">

    <div class="controls">
      <div>
        <label for="photoSize">ഫോട്ടോ വലുപ്പം</label>
        <input type="range" id="photoSize" min="220" max="520" value="330">
      </div>
      <div>
        <label for="photoX">ഫോട്ടോ സ്ഥാനം</label>
        <input type="range" id="photoX" min="0" max="700" value="60">
      </div>
    </div>

    <button id="createBtn">പോസ്റ്റർ ഉണ്ടാക്കുക</button>
    <button id="resetBtn" class="secondary" type="button">Reset</button>
  </div>

  <div class="card">
    <div class="preview-box">
      <canvas id="canvas" width="1080" height="1350"></canvas>
      <img id="preview" alt="Poster preview" class="hidden">
    </div>
    <a id="downloadBtn"><button class="gold">JPG ആയി Download ചെയ്യുക</button></a>
    <div class="small">1080 × 1350 px • 4:5 • High quality</div>
  </div>
</div>

let cropper = null;
let uploaded = false;

const upload = document.getElementById("upload");
const imageEl = document.getElementById("image");
const cropWrap = document.getElementById("cropWrap");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const preview = document.getElementById("preview");
const downloadBtn = document.getElementById("downloadBtn");

const bg = new Image();
bg.src = BG_SRC;

function roundedRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

upload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  uploaded = true;
  const url = URL.createObjectURL(file);
  imageEl.src = url;
  cropWrap.style.display = "block";
  imageEl.onload = () => {
    if (cropper) cropper.destroy();
    cropper = new Cropper(imageEl, {
      aspectRatio: 4/5,
      viewMode: 1,
      dragMode: "move",
      autoCropArea: 0.9,
      background: false,
      responsive: true,
      checkOrientation: true
    });
  };
});

function drawWrappedText(text, x, y, maxWidth, lineHeight) {
  const words = text.trim().split(/\s+/);
  let line = "";
  const lines = [];
  for (const word of words) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
}

function makePoster() {
  if (!bg.complete) {
    bg.onload = makePoster;
    return;
  }
  ctx.clearRect(0,0,1080,1350);
  ctx.drawImage(bg,0,0,1080,1350);

  const name = document.getElementById("nameInput").value.trim();
  const school = document.getElementById("schoolInput").value.trim();
  const photoSize = +document.getElementById("photoSize").value;
  const photoX = +document.getElementById("photoX").value;

  // Personalisation panel at lower-left, above the school image area.
  if (uploaded && cropper) {
    const cropped = cropper.getCroppedCanvas({
      width: 600, height: 750,
      imageSmoothingEnabled: true,
      imageSmoothingQuality: "high"
    });
    const pw = photoSize;
    const ph = photoSize * 1.25;
    const px = Math.min(photoX, 1080-pw-30);
    const py = 980 - ph/2;

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.22)";
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 8;
    roundedRectPath(ctx,px-8,py-8,pw+16,ph+16,28);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.restore();

    ctx.save();
    roundedRectPath(ctx,px,py,pw,ph,22);
    ctx.clip();
    ctx.drawImage(cropped,px,py,pw,ph);
    ctx.restore();

    // Text panel
    const tx = Math.min(px + pw + 35, 650);
    const tw = 1080 - tx - 35;
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,.92)";
    roundedRectPath(ctx,tx,py+35,tw,Math.min(ph-70,250),24);
    ctx.fill();

    ctx.textAlign = "center";
    ctx.fillStyle = "#173d58";
    ctx.font = '900 44px "Noto Sans Malayalam", sans-serif';
    if (name) drawWrappedText(name, tx+tw/2, py+105, tw-40, 60);

    if (school) {
      ctx.fillStyle = "#8c5d1d";
      ctx.font = '700 24px "Noto Sans Malayalam", sans-serif';
      drawWrappedText(school, tx+tw/2, py+205, tw-40, 38);
    }
    ctx.restore();
  } else if (name || school) {
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,.92)";
    roundedRectPath(ctx,110,1020,860,180,28);
    ctx.fill();
    ctx.textAlign = "center";
    ctx.fillStyle = "#173d58";
    ctx.font = '900 52px "Noto Sans Malayalam", sans-serif';
    if(name) ctx.fillText(name,540,1090);
    ctx.fillStyle = "#8c5d1d";
    ctx.font = '700 28px "Noto Sans Malayalam", sans-serif';
    if(school) ctx.fillText(school,540,1150);
    ctx.restore();
  }

  const data = canvas.toDataURL("image/jpeg",0.95);
  preview.src = data;
  preview.classList.remove("hidden");
  downloadBtn.href = data;
  downloadBtn.download = "Teachers-Day-MIUPS-Poster.jpg";
  downloadBtn.style.display = "block";
}

document.getElementById("createBtn").addEventListener("click", makePoster);
document.getElementById("photoSize").addEventListener("input", ()=>{ if(uploaded) makePoster(); });
document.getElementById("photoX").addEventListener("input", ()=>{ if(uploaded) makePoster(); });
document.getElementById("nameInput").addEventListener("input", ()=>{ if(preview.src) makePoster(); });
document.getElementById("schoolInput").addEventListener("input", ()=>{ if(preview.src) makePoster(); });

document.getElementById("resetBtn").addEventListener("click", () => {
  if(cropper) { cropper.destroy(); cropper=null; }
  uploaded=false;
  upload.value="";
  imageEl.src="";
  cropWrap.style.display="none";
  document.getElementById("nameInput").value="";
  document.getElementById("schoolInput").value="എംഐയുപി സ്കൂൾ, കുറ്റ്യാടി";
  preview.classList.add("hidden");
  preview.removeAttribute("src");
  downloadBtn.style.display="none";
});

bg.onload = () => {
  ctx.drawImage(bg,0,0,1080,1350);
  preview.src = canvas.toDataURL("image/jpeg",0.92);
  preview.classList.remove("hidden");
};
</script>
