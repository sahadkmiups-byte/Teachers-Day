<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIUPS Teachers Day Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2f5;font-family:"Noto Sans Malayalam",sans-serif}
.container{max-width:520px;margin:auto;background:white;padding:15px;min-height:100vh}
h2{text-align:center;color:#173e5b;margin:5px 0 18px}
.card{background:#fff;border:1px solid #dce4ea;border-radius:14px;padding:14px;margin-bottom:15px;box-shadow:0 3px 12px #0000000d}
label{display:block;font-weight:700;margin:8px 0 5px;font-size:14px}
input,button{width:100%;font-family:inherit}
input[type=file],input[type=text]{padding:12px;border:1px solid #ccd6dd;border-radius:10px;font-size:15px}
button{padding:13px;border:0;border-radius:10px;background:#173e5b;color:white;font-weight:800;font-size:16px;margin-top:10px}
#cropBox{display:none;max-height:400px;margin-top:12px;overflow:hidden;border-radius:12px;background:#eee}
#image{display:block;max-width:100%}
#preview{width:100%;display:block;border-radius:12px}
#downloadBtn{display:none;text-decoration:none}
.note{font-size:12px;color:#697985;margin:7px 0}
</style>
</head>
<body>
<div class="container">
<h2>അധ്യാപക ദിന പോസ്റ്റർ</h2>

<div class="card">
<label>നിങ്ങളുടെ ഫോട്ടോ തിരഞ്ഞെടുക്കുക</label>
<input type="file" id="upload" accept="image/*">

<div id="cropBox"><img id="image"></div>
<p class="note">ഫോട്ടോയിലെ മുഖം വ്യക്തമായി വരുന്ന രീതിയിൽ crop ചെയ്യുക.</p>

<label>പേര്</label>
<input type="text" id="nameInput" placeholder="Name : ഉദാ: അഹമ്മദ് റാഷിദ്">

<label>Fav School</label>
<input type="text" id="schoolInput" value="എംഐയുപി സ്കൂൾ, കുറ്റ്യാടി" placeholder="Fav School">

<button id="createBtn">പോസ്റ്റർ ഉണ്ടാക്കുക</button>
</div>

<div class="card">
<canvas id="canvas" width="1080" height="1350" style="display:none"></canvas>
<img id="preview">
<a id="downloadBtn"><button>Download Poster</button></a>
</div>
</div>

let cropper=null;
const imageEl=document.getElementById("image");
const upload=document.getElementById("upload");

upload.addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file)return;

  imageEl.src=URL.createObjectURL(file);
  document.getElementById("cropBox").style.display="block";

  imageEl.onload=function(){
    if(cropper)cropper.destroy();

    cropper=new Cropper(imageEl,{
      aspectRatio:3/4,
      viewMode:1,
      dragMode:"move",
      autoCropArea:0.9,
      background:false,
      responsive:true
    });
  };
});

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function fitText(ctx,text,maxWidth,startSize){
  let size=startSize;
  ctx.font=`800 ${size}px "Noto Sans Malayalam", sans-serif`;
  while(ctx.measureText(text).width>maxWidth && size>20){
    size-=1;
    ctx.font=`800 ${size}px "Noto Sans Malayalam", sans-serif`;
  }
  return size;
}

document.getElementById("createBtn").addEventListener("click",function(){
  if(!cropper){
    alert("ദയവായി ഒരു ഫോട്ടോ തിരഞ്ഞെടുക്കുക");
    return;
  }

  const canvas=document.getElementById("canvas");
  const ctx=canvas.getContext("2d");
  const bg=new Image();

  bg.onload=function(){
    ctx.clearRect(0,0,1080,1350);
    ctx.drawImage(bg,0,0,1080,1350);

    const cropped=cropper.getCroppedCanvas({
      width:600,
      height:800,
      imageSmoothingEnabled:true,
      imageSmoothingQuality:"high"
    });

    /*
      EXACT LAYOUT LIKE YOUR SECOND IMAGE:
      Photo: LEFT BOTTOM
      Name + School: RIGHT SIDE OF PHOTO
    */

    const photoX=38;
    const photoY=900;
    const photoW=310;
    const photoH=414;

    // White photo border
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.18)";
    ctx.shadowBlur=18;
    ctx.shadowOffsetY=5;
    roundRect(ctx,photoX-8,photoY-8,photoW+16,photoH+16,26);
    ctx.fillStyle="#ffffff";
    ctx.fill();
    ctx.restore();

    // Rounded photo
    ctx.save();
    roundRect(ctx,photoX,photoY,photoW,photoH,20);
    ctx.clip();
    ctx.drawImage(cropped,photoX,photoY,photoW,photoH);
    ctx.restore();

    // NAME / SCHOOL AREA — right side of photo
    const name=document.getElementById("nameInput").value.trim();
    const school=document.getElementById("schoolInput").value.trim();

    const textX=385;
    const textW=390;

    // Name
    if(name){
      ctx.save();
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillStyle="#ffffff";
      roundRect(ctx,textX,940,textW,72,18);
      ctx.fill();

      ctx.fillStyle="#1a3346";
      const fs=fitText(ctx,name,textW-30,30);
      ctx.font=`800 ${fs}px "Noto Sans Malayalam", sans-serif`;
      ctx.fillText(name,textX+textW/2,976);
      ctx.restore();
    }

    // School
    if(school){
      ctx.save();
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillStyle="rgba(255,255,255,0.94)";
      roundRect(ctx,textX+20,1035,textW-40,54,14);
      ctx.fill();

      ctx.fillStyle="#9b681f";
      ctx.font='700 21px "Noto Sans Malayalam", sans-serif';
      let schoolText=school;
      while(ctx.measureText(schoolText).width>textW-70 && schoolText.length>5){
        const words=schoolText.split(" ");
        if(words.length>1){
          words.pop();
          schoolText=words.join(" ");
        }else break;
      }
      ctx.fillText(schoolText,textX+textW/2,1062);
      ctx.restore();
    }

    const data=canvas.toDataURL("image/jpeg",0.96);
    const preview=document.getElementById("preview");
    preview.src=data;

    const dl=document.getElementById("downloadBtn");
    dl.href=data;
    dl.download="MIUPS-Teachers-Day-Poster.jpg";
    dl.style.display="block";

    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  };

  bg.src=BG;
});
</script>
